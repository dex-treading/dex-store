<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب جديد - متجر DEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <div class="bg-emerald-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-lg">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-bold">إنشاء حساب جديد</h2>
            <p class="text-slate-400 text-sm mt-1">انضم إلى متجر DEX واستمتع بتجربة فريدة</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">الاسم الكامل</label>
                <input type="text" id="fullName" required placeholder="فارس عبدالله" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-emerald-500 focus:outline-none text-white">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-emerald-500 focus:outline-none text-white">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">كلمة المرور</label>
                <input type="password" id="password" minlength="6" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-emerald-500 focus:outline-none text-white">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">كود الدعوة <span class="text-slate-500 text-xs">(اختياري)</span></label>
                <input type="text" id="referralCode" placeholder="أدخل كود الدعوة إن وجد" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-emerald-500 focus:outline-none text-white">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all mt-2">
                تسجيل الحساب
            </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
            لديك حساب بالفعل؟ 
            <a href="login.html" class="text-emerald-400 hover:text-emerald-300 font-bold underline">تسجيل الدخول</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmrbmoygygdewhlvtbo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptcnJibW95Z2d5ZGV3aGx2dGJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODQ3OTIsImV4cCI6MjEwNzk2MDc5Mn0.hVB9okpIXoFIAS-C5dYBz7MZizYZtRpVn_KVya5jH2Y';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const referralCode = document.getElementById('referralCode').value;
            const btn = document.getElementById('submitBtn');

            btn.innerText = 'جاري التسجيل...';
            btn.disabled = true;

            try {
                // الاتصال المباشر عبر بروتوكول HTTP Fetch لتجاوز قيود الـ SDK
                const response = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        data: {
                            full_name: fullName,
                            referral_code: referralCode
                        }
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.msg || result.error_description || result.message || 'فشل الاتصال بخادم السيرفر');
                }

                alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
                window.location.href = 'login.html';
            } catch (err) {
                console.error(err);
                alert('خطأ أثناء التسجيل: ' + err.message);
                btn.innerText = 'تسجيل الحساب';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
