<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب جديد - المتجر الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <div class="bg-emerald-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-lg shadow-emerald-500/50">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-bold">إنشاء حساب جديد</h2>
            <p class="text-slate-400 text-sm mt-1">انضم إلينا واستمتع بتجربة تسوق رقمية</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">الاسم الكامل</label>
                <input type="text" id="fullName" required placeholder="فارس عبدالله" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-emerald-500 focus:outline-none transition-all text-white placeholder-slate-400">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-emerald-500 focus:outline-none transition-all text-white placeholder-slate-400">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">كلمة المرور</label>
                <input type="password" id="password" minlength="6" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-emerald-500 focus:outline-none transition-all text-white placeholder-slate-400">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition-all mt-2">
                تسجيل الحساب
            </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
            لديك حساب بالفعل؟ 
            <a href="login.html" class="text-emerald-400 hover:text-emerald-300 font-bold underline">تسجيل الدخول</a>
        </p>
    </div>

</body>
</html>
