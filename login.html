<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - المتجر الرقمي</title>
    <!-- Tailwind CSS للتنسيق الاحترافي السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <!-- اللوجو والعنوان -->
        <div class="text-center mb-8">
            <div class="bg-indigo-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-lg shadow-indigo-500/50">
                <i class="fa-solid fa-store"></i>
            </div>
            <h2 class="text-2xl font-bold">تسجيل الدخول</h2>
            <p class="text-slate-400 text-sm mt-1">مرحباً بك مجدداً في متجرك الرقمي</p>
        </div>

        <!-- نموذج الدخول -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">البريد الإلكتروني</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required placeholder="name@example.com" class="w-full pr-10 pl-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-indigo-500 focus:outline-none transition-all text-white placeholder-slate-400">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">كلمة المرور</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pr-10 pl-4 py-3 rounded-xl bg-slate-700 border border-slate-600 focus:border-indigo-500 focus:outline-none transition-all text-white placeholder-slate-400">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition-all">
                دخول
            </button>
        </form>

        <!-- رابط إنشاء حساب -->
        <p class="text-center text-slate-400 text-sm mt-6">
            ليس لديك حساب؟ 
            <a href="signup.html" class="text-indigo-400 hover:text-indigo-300 font-bold underline">إنشاء حساب جديد</a>
        </p>
    </div>

</body>
</html>
