<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيداع رصيد - متجر DEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex items-center justify-center">

    <div class="bg-slate-800 rounded-3xl p-8 max-w-lg w-full border border-slate-700 shadow-2xl">
        <a href="index.html" class="inline-flex items-center gap-2 text-indigo-400 hover:text-indigo-300 font-semibold mb-6">
            <i class="fa-solid fa-arrow-right"></i> إلغاء والعودة لمتجر DEX
        </a>

        <h2 class="text-2xl font-bold mb-2 text-white">إيداع رصيد في المحفظة</h2>
        <p class="text-slate-400 text-sm mb-6">اختر طريقة الدفع المناسبة لشحن حسابك في متجر DEX</p>

        <form class="space-y-4" onsubmit="event.preventDefault(); alert('تم استلام طلب الإيداع بنجاح، سيتم معالجة العملية قريباً.'); window.location.href='profile.html';">
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">المبلغ المراد إيداعه ($)</label>
                <input type="number" min="1" required placeholder="100" class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <label class="block text-sm font-medium text-slate-300 mt-4">وسيلة الدفع</label>
            <div class="grid grid-cols-2 gap-3">
                <label class="border border-indigo-600 bg-indigo-600/10 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-brands fa-cc-visa text-2xl text-indigo-400"></i>
                    <span class="text-xs font-bold">بطاقات بانكية</span>
                </label>
                <label class="border border-slate-700 bg-slate-700/50 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:border-slate-500">
                    <i class="fa-brands fa-bitcoin text-2xl text-amber-400"></i>
                    <span class="text-xs font-bold">عملات رقمية</span>
                </label>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all mt-4">
                تأكيد العملية
            </button>
        </form>
    </div>

</body>
</html>
