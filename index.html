<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الرقمي المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- شريط التنقل العلوي -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl text-xl font-bold shadow-lg">
                        <i class="fa-solid fa-store"></i>
                    </div>
                    <span class="font-bold text-xl text-white">متجري الرقمي</span>
                </div>

                <div class="flex items-center gap-2">
                    <a href="login.html" class="px-3 py-2 text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition-all">
                        <i class="fa-solid fa-right-to-bracket ml-1"></i> دخول
                    </a>
                    <a href="signup.html" class="px-3 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-md transition-all">
                        حساب جديد
                    </a>
                    <a href="profile.html" class="p-2 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg" title="المحفظة">
                        <i class="fa-solid fa-wallet text-lg"></i>
                    </a>
                    <a href="deposit.html" class="p-2 text-emerald-400 hover:text-emerald-300 hover:bg-slate-700 rounded-lg" title="الإيداع">
                        <i class="fa-solid fa-circle-plus text-lg"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- أقسام المتجر -->
    <div class="bg-slate-800/50 border-b border-slate-700/50 py-3">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-center gap-2 overflow-x-auto">
            <button onclick="filterCat('all')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap">الكل</button>
            <button onclick="filterCat('clothing')" class="bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap">الملابس</button>
            <button onclick="filterCat('electronics')" class="bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap">الأجهزة الكهربائية</button>
            <button onclick="filterCat('phones_computers')" class="bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap">الهواتف والحواسيب</button>
            <button onclick="filterCat('sports_shoes')" class="bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap">الأحذية الرياضية</button>
        </div>
    </div>

    <!-- شبكة المنتجات -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <h2 id="sectionTitle" class="text-2xl font-bold mb-6 text-white border-r-4 border-indigo-500 pr-3">جميع المنتجات</h2>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script>
        const products = [
            { id: 1, title: 'قميص قطني فاخر', category: 'clothing', price: 29.99, image: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500' },
            { id: 2, title: 'جاكيت شتوي', category: 'clothing', price: 64.99, image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500' },
            { id: 3, title: 'خلاط كهربائي متطور', category: 'electronics', price: 85.00, image: 'https://images.unsplash.com/photo-1570222094114-d074f7e1e6e0?w=500' },
            { id: 4, title: 'آلة صُنُع القهوة', category: 'electronics', price: 130.00, image: 'https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=500' },
            { id: 5, title: 'هاتف آيفون برو', category: 'phones_computers', price: 999.00, image: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500' },
            { id: 6, title: 'حاسوب محمول عالي الأداء', category: 'phones_computers', price: 1250.00, image: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500' },
            { id: 7, title: 'حذاء جري احترافي', category: 'sports_shoes', price: 75.00, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500' },
            { id: 8, title: 'حذاء رياضي يومي', category: 'sports_shoes', price: 55.00, image: 'https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500' }
        ];

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = list.map(item => `
                <div class="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-lg hover:border-indigo-500/50 transition-all group">
                    <div class="h-48 overflow-hidden relative">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-300">
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-lg text-white mb-2">${item.title}</h3>
                        <div class="flex items-center justify-between mt-4">
                            <span class="text-emerald-400 font-bold text-xl">$${item.price}</span>
                            <button class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl transition-all">
                                <i class="fa-solid fa-cart-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCat(cat) {
            if (cat === 'all') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        window.onload = () => renderProducts(products);
    </script>
</body>
</html>
